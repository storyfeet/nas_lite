[package]
name = "nas_lite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
blake3 = "1.8.7"
chrono = "0.4.45"
diesel = {version = "2.3.12" , features = ["sqlite","chrono"]}
diesel-async = {version = "0.9.2", features = ["sync-connection-wrapper","sqlite","tokio","pool","bb8"]}
dotenvy = "0.15.7"
err_tools = "0.2.3"
iter_tools = "0.50.0"
rand = "0.10.2"
reqwest = {version = "0.13.4", features = ["json"]}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
structopt = "0.3.26"
tokio = { version = "1.53.1", features = ["full"] }
